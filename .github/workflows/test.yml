name: Test & Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Run Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint -- --max-warnings=100
        continue-on-error: false

      - name: Type check with TypeScript
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm run test
        env:
          JWT_SECRET: test_secret_for_ci_only_minimum_32_characters_long
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          SUPABASE_SERVICE_ROLE_KEY: test_service_role_key_for_ci

      - name: Build Next.js application
        run: npm run build
        env:
          JWT_SECRET: test_secret_for_ci_only_minimum_32_characters_long
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          SUPABASE_SERVICE_ROLE_KEY: test_service_role_key_for_ci

      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-coverage
          path: coverage/
          retention-days: 30

  status-check:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    steps:
      - name: Check test job status
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Tests failed!"
            exit 1
          fi
          echo "All checks passed! ✅"
