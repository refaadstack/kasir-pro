name: PR Quality Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr-check:
    name: PR Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for console.log
        run: |
          if git diff origin/${{ github.base_ref }}...HEAD -- '*.ts' '*.tsx' | grep -E '^\+.*console\.(log|debug|info)'; then
            echo "⚠️  Warning: Found console.log in your changes"
            echo "Please remove console.log statements before merging"
            exit 1
          fi
        continue-on-error: true

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          JWT_SECRET: test_secret_for_ci_only_minimum_32_characters_long
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          SUPABASE_SERVICE_ROLE_KEY: test_service_role_key_for_ci

      - name: Comment PR with results
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const coverage = fs.existsSync('coverage/coverage-summary.json') 
              ? JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'))
              : null;
            
            let message = '## 🧪 Test Results\n\n';
            message += '✅ All tests passed!\n\n';
            
            if (coverage) {
              const total = coverage.total;
              message += '### Coverage Summary\n';
              message += `- **Lines**: ${total.lines.pct}%\n`;
              message += `- **Statements**: ${total.statements.pct}%\n`;
              message += `- **Functions**: ${total.functions.pct}%\n`;
              message += `- **Branches**: ${total.branches.pct}%\n`;
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });
